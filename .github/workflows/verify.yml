name: Verify application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Disposable CI-only credentials; no production secrets or paid API keys.
      POSTGRES_PASSWORD: ci-postgres-disposable
      NEO4J_PASSWORD: ci-neo4j-disposable
      DATABASE_URL: postgresql://finance_detective:ci-postgres-disposable@127.0.0.1:55432/finance_detective
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      AI_AUTH_MODE: token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          npm ci --prefix frontend
      - name: Start test databases
        run: docker compose up -d --wait --wait-timeout 180
      - name: Test backend with real PostgreSQL and Neo4j
        run: python -m pytest -q
      - name: Build React application
        run: npm run build --prefix frontend
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes
